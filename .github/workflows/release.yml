name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      - name: Build standalone app
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console --name osprey ^
            --paths src --contents-directory . ^
            --hidden-import osprey.gui --collect-submodules osprey ^
            --distpath dist --workpath build\pyi --specpath build ^
            packaging\entry.py

      - name: Build installer and portable zip
        run: python packaging\build_installer.py

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Osprey-*-Setup.exe
            dist/Osprey-*-win64-portable.zip
