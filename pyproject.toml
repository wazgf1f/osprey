[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osprey-automation"
version = "0.1.2"
description = "Screen-vision automation engine for Windows: capture, detect, decide, act."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Zhaorui Chen" }]
keywords = [
    "automation", "computer-vision", "template-matching", "rpa",
    "win32", "sendinput", "screen-capture", "game-automation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]
dependencies = [
    "numpy>=1.23",
    "Pillow>=9.0",
]

[project.optional-dependencies]
opencv = ["opencv-python-headless>=4.8"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]

[project.scripts]
osprey = "osprey.cli:main"

[project.urls]
Homepage = "https://github.com/wazgf1f/osprey"
Issues = "https://github.com/wazgf1f/osprey/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:osprey.*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
